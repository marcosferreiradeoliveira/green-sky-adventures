name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

env:
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
  VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Debug Environment Variables
        run: |
          echo "🔍 Debugging environment variables..."
          echo "VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:0:10}..."
          echo "VITE_FIREBASE_PROJECT_ID: $VITE_FIREBASE_PROJECT_ID"
          echo "Environment variables count: $(env | grep VITE_FIREBASE | wc -l)"
          
      - name: Build
        run: |
          echo "🏗️ Building with environment variables..."
          
          # As variáveis já estão no ambiente, o Vite deve conseguir acessá-las
          # Mas vamos garantir criando um .env também
          echo "VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID" >> .env
          echo "VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID" >> .env
          echo "VITE_FIREBASE_MEASUREMENT_ID=$VITE_FIREBASE_MEASUREMENT_ID" >> .env
          
          echo "=== Environment check ==="
          echo "Total VITE vars: $(env | grep VITE_FIREBASE | wc -l)"
          echo "First var: $(env | grep VITE_FIREBASE | head -1 | cut -d= -f1)"
          echo "========================="
          
          # Build do projeto
          npm run build
          
          # Verificar se o build foi criado corretamente
          echo "=== Build verification ==="
          ls -la dist/
          echo "Index.html exists: $([ -f dist/index.html ] && echo 'YES' || echo 'NO')"
          echo "Assets folder: $([ -d dist/assets ] && echo 'YES' || echo 'NO')"
          
          # CRÍTICO: Verificar se as env vars foram incluídas no bundle
          if [ -f dist/assets/*.js ]; then
            echo "Checking if Firebase config is in bundle..."
            grep -q "green-sky-b545b" dist/assets/*.js && echo "✅ Firebase config found in bundle" || echo "❌ Firebase config NOT found in bundle"
          fi
          echo "========================="
      
      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GREEN_SKY_B545B }}
          channelId: live
          projectId: green-sky-b545b
          # IMPORTANTE: Usar o dist/ que já buildamos
          entryPoint: .
          # Se a action ainda tentar fazer build, podemos desabilitar
          target: green-sky-b545b